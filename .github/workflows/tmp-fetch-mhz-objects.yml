name: Temporary MHZ object data export
on:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official Sonic 3K MHZ object layouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mhz-source/act1 mhz-source/act2
          curl -fL 'https://raw.githubusercontent.com/sonicretro/skdisasm/master/Levels/MHZ/Object%20Pos/1.bin' -o mhz-source/act1/ObjectPos.bin
          curl -fL 'https://raw.githubusercontent.com/sonicretro/skdisasm/master/Levels/MHZ/Object%20Pos/2.bin' -o mhz-source/act2/ObjectPos.bin
          curl -fL 'https://raw.githubusercontent.com/sonicretro/skdisasm/master/Levels/MHZ/Ring%20Pos/1.bin' -o mhz-source/act1/RingPos.bin
          curl -fL 'https://raw.githubusercontent.com/sonicretro/skdisasm/master/Levels/MHZ/Ring%20Pos/2.bin' -o mhz-source/act2/RingPos.bin
          curl -fL 'https://raw.githubusercontent.com/sonicretro/skdisasm/master/Levels/MHZ/Start%20Location/Sonic/1.bin' -o mhz-source/act1/SonicStart.bin
          curl -fL 'https://raw.githubusercontent.com/sonicretro/skdisasm/master/Levels/MHZ/Start%20Location/Sonic/2.bin' -o mhz-source/act2/SonicStart.bin
          (cd mhz-source && zip -r ../mhz-original-layouts.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: mhz-original-layouts
          path: mhz-original-layouts.zip
          if-no-files-found: error
