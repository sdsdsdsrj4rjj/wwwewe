name: Temporary ZIP export
on:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: repository-zip
          path: mhzrsdkv5u.zip
          if-no-files-found: error
